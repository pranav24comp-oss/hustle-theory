<!DOCTYPE html>
<html>
  <head>
    <title>Financial Challenges - Hustle Theory</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      .challenges-container {
        max-width: 1200px;
        margin: 60px auto;
        padding: 20px;
      }

      .challenges-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .challenges-header h1 {
        font-size: 2.5em;
        color: #2c3e50;
        margin-bottom: 10px;
      }

      .challenges-header p {
        font-size: 1.1em;
        color: #7f8c8d;
      }

      .stats-box {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }

      .stat-card h3 {
        margin: 0 0 10px 0;
        font-size: 0.9em;
        opacity: 0.9;
      }

      .stat-value {
        font-size: 2.5em;
        font-weight: bold;
      }

      .challenges-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
      }

      .challenge-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
        cursor: pointer;
        border-top: 4px solid #667eea;
      }

      .challenge-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      .challenge-card.completed {
        opacity: 0.7;
        border-top-color: #28a745;
      }

      .challenge-icon {
        font-size: 3em;
        padding: 20px;
        text-align: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .challenge-card.completed .challenge-icon {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      }

      .challenge-content {
        padding: 20px;
      }

      .challenge-title {
        font-size: 1.3em;
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 10px;
      }

      .challenge-description {
        color: #7f8c8d;
        margin-bottom: 15px;
        font-size: 0.95em;
        line-height: 1.5;
      }

      .challenge-reward {
        background: #f8f9fa;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .reward-amount {
        background: #667eea;
        color: white;
        padding: 8px 15px;
        border-radius: 20px;
        font-weight: bold;
      }

      .challenge-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #667eea;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }

      .challenge-button:hover {
        background: #5568d3;
        transform: scale(1.02);
      }

      .challenge-button.completed {
        background: #28a745;
        cursor: default;
      }

      .challenge-button.completed:hover {
        background: #28a745;
        transform: none;
      }

      .challenge-detail-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .challenge-detail-content {
        background: white;
        padding: 40px;
        border-radius: 15px;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .close-modal {
        float: right;
        font-size: 2em;
        cursor: pointer;
        color: #7f8c8d;
      }

      .close-modal:hover {
        color: #2c3e50;
      }

      .detail-icon {
        font-size: 4em;
        text-align: center;
        margin: 20px 0;
        clear: both;
      }

      .detail-title {
        font-size: 2em;
        color: #2c3e50;
        margin: 20px 0;
        text-align: center;
      }

      .detail-description {
        color: #34495e;
        line-height: 1.8;
        margin: 20px 0;
      }

      .detail-learning {
        background: #e8f4f8;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        border-left: 4px solid #667eea;
      }

      .detail-learning h4 {
        margin: 0 0 10px 0;
        color: #667eea;
      }

      .detail-learning p {
        margin: 0;
        color: #34495e;
      }

      .detail-reward {
        background: #f0f8ff;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        text-align: center;
        border: 2px solid #667eea;
      }

      .detail-reward p {
        margin: 0;
        color: #667eea;
        font-weight: bold;
        font-size: 1.2em;
      }

      .complete-challenge-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 20px;
      }

      .complete-challenge-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .complete-challenge-btn.completed {
        background: #28a745;
        cursor: default;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body class="challenge-page">
    <!-- Smart Owl Mascot -->
    <div class="mascot bottom-right" id="mascot" onclick="showFinancialFact()">
      <div class="mascot-icon">🦉</div>
    </div>

    <!-- Fun Fact Popup Modal -->
    <div id="factModal" class="modal" style="display: none">
      <div class="modal-content">
        <span class="close" onclick="closeFactModal()">&times;</span>
        <div class="modal-owl">🦉</div>
        <h2>Fun Financial Fact! 💡</h2>
        <p id="factText"></p>
        <button onclick="showFinancialFact()" class="fact-btn">
          Tell me another!
        </button>
      </div>
    </div>

    <div class="navbar">
      <div><b>Hustle Theory</b></div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#progress">Progress</a>
        <a href="index.html#modules">Modules</a>
        <a href="index.html#rewards">Rewards</a>
        <a href="wallet.html">E-Wallet</a>
        <a href="tracker.html">Tracker</a>
        <button onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="challenges-container">
      <a href="index.html" class="back-link">← Back to Dashboard</a>

      <div class="challenges-header">
        <h1>💰 Financial Challenges</h1>
        <p>Complete challenges to learn about money and earn rewards!</p>
      </div>

      <div class="stats-box">
        <div class="stat-card">
          <h3>Challenges Completed</h3>
          <div class="stat-value" id="completedCount">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Earned</h3>
          <div class="stat-value" id="totalEarned">₹0</div>
        </div>
        <div class="stat-card">
          <h3>Learning Points</h3>
          <div class="stat-value" id="learningPoints">0</div>
        </div>
      </div>

      <div class="challenges-grid" id="challengesGrid"></div>
    </div>

    <!-- Challenge Detail Modal -->
    <div class="challenge-detail-modal" id="detailModal">
      <div class="challenge-detail-content">
        <span class="close-modal" onclick="closeDetail()">&times;</span>
        <div class="detail-icon" id="detailIcon"></div>
        <h2 class="detail-title" id="detailTitle"></h2>
        <div class="detail-description" id="detailDescription"></div>
        <div class="detail-learning" id="detailLearning"></div>
        <div class="detail-reward" id="detailReward"></div>
        <button class="complete-challenge-btn" id="completeBtn" onclick="completeChallenge()">
          Complete Challenge
        </button>
      </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/challenge2.js"></script>
  </body>
</html>
